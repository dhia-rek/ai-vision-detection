[project]
name = "ai-vision-detection"
version = "1.0.0"
description = "FastAPI + YOLOv8 web app for object detection on images and live webcam"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhia" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "python-multipart>=0.0.20",
    "opencv-python-headless>=4.11",
    "numpy>=2.0",
    "pillow>=11.0",
    "ultralytics>=8.3",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.13"]

[tool.uv]
package = false
# Ultralytics pulls in the GUI build of OpenCV; we only need the headless one.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# CPU-only torch on Linux (CI, Docker, HF Spaces); default wheels elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["slow: runs the real YOLOv8 model (needs weights)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
