name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: System libraries for MediaPipe (EGL/GLES)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libgl1
      - name: Cache pretrained models
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-vision-detection/models
          key: models-${{ hashFiles('backend/app/zoo.py') }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run interrogate
      - name: Browser test dependencies (pinned runtimes, ffmpeg, Chromium)
        run: |
          uv run python scripts/export_web_models.py --only vendor
          sudo apt-get install -y -q ffmpeg
          uv run playwright install --with-deps chromium
      - name: Tests (including the browser parity and end-to-end suites)
        env:
          AVD_REQUIRE_BROWSER: "1"
        run: uv run pytest -q -rs

  smoke:
    name: Smoke test (real models on CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: System libraries for MediaPipe (EGL/GLES)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libgl1
      - name: Cache pretrained models
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-vision-detection/models
          key: models-${{ hashFiles('backend/app/zoo.py') }}
      - name: API with real models, all modes
        working-directory: backend
        run: |
          # Run from .venv directly: a background `uv run` keeps the uv cache locked.
          ../.venv/bin/uvicorn app.main:app --port 8000 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "AI Vision"
          analyze() { curl -sf -F "file=@samples/$1;type=image/jpeg" "localhost:8000/api/analyze?annotate=false&$2"; }
          analyze objects/cats.jpg "mode=objects" | grep -q '"class":"cat"'
          analyze faces/happy.jpg "mode=faces" | grep -q '"class":"happy"'
          analyze sign/gesture_i_love_you.jpg "mode=sign&sign_mode=gestures" | grep -q 'I love you'
          analyze sign/letter_B.jpg "mode=sign&sign_mode=spell" | grep -q '"class":"B"'
