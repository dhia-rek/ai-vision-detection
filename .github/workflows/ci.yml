name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  smoke:
    name: Smoke test (offline demo, real YOLOv8n on CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Demo CLI
        working-directory: backend
        run: ../.venv/bin/python -m app.demo | tee demo.txt && grep -q "dog" demo.txt
      - name: Demo API
        working-directory: backend
        run: |
          # Run from .venv directly: a background `uv run` keeps the uv cache locked.
          ../.venv/bin/uvicorn app.main:app --port 8000 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "AI Vision"
          curl -sf localhost:8000/demo/samples | grep -q street.jpg
          curl -sf -X POST localhost:8000/demo/detect/cats.jpg | grep -q '"class":"cat"'
